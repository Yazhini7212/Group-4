# Makes the code in src/ installable, so notebooks can simply `import chest_overlap`.
# Install (once, inside your environment):   pip install -e .
# "-e" = editable: changes you make in src/ are picked up without reinstalling.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chest_overlap"
version = "0.1.0"
description = "Image- and patient-level overlap across public chest radiograph collections"
requires-python = ">=3.9"
dependencies = [
    "kaggle>=1.6",
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "opencv-python-headless>=4.8",
    "pydicom>=2.4",
    "openpyxl>=3.1",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
# Everything needed to run the notebooks in VS Code or JupyterLab.
notebook = ["ipykernel>=6.25", "ipywidgets>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
